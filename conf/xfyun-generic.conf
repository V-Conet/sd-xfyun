# 备用方案：不装原生模块，直接用 speech-dispatcher 自带的 sd_generic 调用 xfyun-say。
#
# 优点：不需要把二进制放进 speech-dispatcher 的模块目录；
# 缺点：每次朗读都要起一个新进程（SDK 初始化较慢），且语音列表只有语种粒度。
# 原生模块（sd_xfyun）是推荐用法。
#
# 用法：把本文件放到 <配置目录>/modules/xfyun-generic.conf，然后在 speechd.conf 里
#   AddModule "xfyun-generic" "sd_generic" "xfyun-generic.conf"
#   DefaultModule xfyun-generic

Debug 0

# $DATA 会被 sd_generic 替换成文本（单引号已转义），$RATE/$PITCH/$VOLUME 是 -100..100，
# $VOICE 是客户端选的语音名。--play 让 xfyun-say 自己播放（不需要 $PLAY_COMMAND）。
GenericExecuteSynth \
"/usr/local/bin/xfyun-say --play --config '/etc/speech-dispatcher/modules/xfyun-tts.conf' --voice '$VOICE' --rate $RATE --pitch $PITCH --volume $VOLUME --text '$DATA'"

GenericCmdDependency "xfyun-say"

# 语种 → 中文/英文
GenericLanguage "zh" "zh-CN" "UTF-8"
GenericLanguage "en" "en-US" "UTF-8"
GenericDefaultCharset "UTF-8"
