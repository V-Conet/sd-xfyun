# sd-xfyun：讯飞 AIkit 离线语音合成（speech-dispatcher 输出模块）
#
# 这个文件由 speech-dispatcher 作为命令行参数传给 sd_xfyun（见 AddModule 的第三个字段），
# 由模块自己解析。@SDK_ROOT@ / @LIBS_DIR@ / @RES_DIR@ / @DATA_DIR@ 这些占位符由
# install.sh 或打包脚本按实际安装位置替换；直接手动使用时把它们改成真实路径即可。
#
# 语法与 speech-dispatcher 其它模块配置一致：`键 值`，`#` 后为注释。

Debug 0

# ── SDK 与资源 ───────────────────────────────────────────────
# 讯飞 AIkit Linux SDK 包根目录（其中应有 libs/libaikit.so、libs/*_aee.so、xtts/）
XfyunSdkRoot "@SDK_ROOT@"
# 引擎动态库目录（libaikit.so、*_aee.so）
XfyunLibsDir "@LIBS_DIR@"
# 资源目录（其下要有 xtts/）
XfyunResDir "@RES_DIR@"

# ── 授权（关键：复用授权文件，避免反复注册耗尽装机量）─────────
# SDK 会把授权缓存在这个目录，必须可写，且**保持稳定**（换目录可能要重新激活）。
# 不设置时按用户默认：$XDG_DATA_HOME/sd-xfyun/work（即 ~/.local/share/sd-xfyun/work）；
# 由 root 运行的服务可显式设成 /var/lib/sd-xfyun/work。
#XfyunWorkDir "@DATA_DIR@/work"
# 离线激活文件或已有授权文件的来源；模块只复制、不移动，源文件始终保留
#XfyunLicenseFile "/path/to/<appid><32位hex>"
# 1 = 找不到本地授权文件时直接报错，绝不联网激活（开发/多机分发时建议打开）
XfyunOfflineOnly 0
# 授权检查间隔（秒）。SDK 默认 300，调大可以少跑网络
XfyunAuthCheckInterval 3600

# ── 声音 ─────────────────────────────────────────────────────
# 默认发音人；实际可用列表以 xtts/ 资源文件为准（本包只有 xiaoyan / xiaofeng）
XfyunDefaultVoice "xiaoyan"
XfyunDefaultLanguage "zh-CN"
XfyunSpeed 50
XfyunPitch 50
XfyunVolume 50

# ── 音频出口 ─────────────────────────────────────────────────
# 1 = 把音频交给 speech-dispatcher 播放（推荐，走 705 协议，服务端负责设备与打断）
# 0 = 模块自己拉起播放器（pw-play / paplay / aplay），并自行处理 STOP
XfyunServerAudio 1
# 自播放时使用的播放器命令；留空则按服务的音频后端自动探测
#XfyunPlayer "pw-play"

# ── 其它 ─────────────────────────────────────────────────────
# 单次送进引擎的最大字数：越小首字越快、STOP 越及时，但会话开销略多
XfyunMaxChunk 120
# 0=error 1=warn 2=info 3=debug 4=trace
XfyunLogLevel 1
# 日志文件（同时接收 SDK 日志）；留空则 SDK 日志写到 speech-dispatcher 的日志目录
#XfyunLogFile "/tmp/sd-xfyun.log"
# 1 = 启动时自动补 LD_LIBRARY_PATH 再 exec 一次，让 SDK 能 dlopen 到引擎库 *_aee.so。
# 引擎库没有 SONAME、ldconfig 不会索引它，只配 ld.so.conf.d 是不够的。
# 打包安装（libaikit.so 已被 patchelf 改成 RUNPATH=$ORIGIN、与引擎库同目录）时设 0。
XfyunReexec 1
